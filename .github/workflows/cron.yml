name: YODHA Daily Cron

on:
  schedule:
    - cron: '30 0 * * *'   # 6 AM IST
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run cron task
        run: |
          echo "YODHA cron running..."
          date
