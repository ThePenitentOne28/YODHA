<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up | YODHA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar auth-navbar">
        <div class="nav-brand">YODHA</div>
        <a href="index.html" class="auth-home">Home</a>
    </nav>

    <div class="page-content">

        <div class="auth-box">
            <h2>Sign Up</h2>

            <form id="signupForm">

                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>

                <button type="submit">Create Account</button>
            </form>

            <p id="signupStatus" style="margin-top:10px;"></p>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseClient = supabase.createClient(
            "https://buvmqkgurywfadapamjx.supabase.co",
            "sb_publishable_5iQt2xlb0DXb8pcuXEdDAg_4GQp-VYQ"
        );

        const form = document.getElementById("signupForm");
        const status = document.getElementById("signupStatus");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: name
                    }
                }
            });

            if (error) {
                status.textContent = error.message;
                status.style.color = "red";
            } else {
                status.textContent = "Signup successful!";
                status.style.color = "green";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);
            }
        });
    </script>

</body>

</html>
